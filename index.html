<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yes, It's My Website, Aaron</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #111827, #4f46e5);
      color: white;
      text-align: center;
    }
    .card {
      padding: 60px 40px;
      max-width: 800px;
    }
    h1 {
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 0.95;
      margin: 0;
      letter-spacing: -4px;
    }
    p {
      margin-top: 28px;
      font-size: 1.2rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Yes, it’s my website, Aaron.</h1>
    <p>You found it. Congratulations.</p>
  </main>
</body>
</html>
